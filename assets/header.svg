<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1000"
     height="260"
     viewBox="0 0 1000 260">

<style>

.background {
    fill:#0d1117;
}

.window {
    fill:#161b22;
    stroke:#30363d;
    stroke-width:2;
}

.title {
    fill:#58a6ff;
    font-family: Consolas, Monaco, monospace;
    font-size:42px;
    font-weight:bold;
}

.subtitle {
    fill:#c9d1d9;
    font-family: Consolas, Monaco, monospace;
    font-size:22px;
}

.prompt {
    fill:#3fb950;
    font-family: Consolas, Monaco, monospace;
    font-size:20px;
}

.small {
    fill:#8b949e;
    font-family: Consolas, Monaco, monospace;
    font-size:18px;
}

.cursor {
    fill:#3fb950;
    animation: blink 1s infinite;
}

@keyframes blink {
    0% {opacity:1;}
    50% {opacity:0;}
    100% {opacity:1;}
}

.fade {
    opacity:0;
    animation: fadeIn .8s forwards;
}

.delay1 { animation-delay:.2s; }
.delay2 { animation-delay:.8s; }
.delay3 { animation-delay:1.4s; }
.delay4 { animation-delay:2.0s; }

@keyframes fadeIn {
    from {
        opacity:0;
        transform:translateY(10px);
    }
    to {
        opacity:1;
        transform:translateY(0px);
    }
}

</style>

<rect width="1000" height="260" rx="18" class="background"/>

<rect x="15" y="15" width="970" height="230" rx="12" class="window"/>

<circle cx="45" cy="45" r="7" fill="#ff5f56"/>
<circle cx="67" cy="45" r="7" fill="#ffbd2e"/>
<circle cx="89" cy="45" r="7" fill="#27c93f"/>

<text x="35" y="100" class="prompt">$ whoami</text>
<rect class="cursor" x="140" y="84" width="12" height="20"/>

<text x="35" y="150" class="title fade delay1">Syed Riajul Islam</text>

<text x="35" y="185" class="subtitle fade delay2">Backend Developer</text>

<text x="35" y="212" class="small fade delay3">Building scalable backend systems</text>

<text x="35" y="238" class="small fade delay4">Python • Django • FastAPI • Socket.IO • PostgreSQL • Redis</text>

</svg>
