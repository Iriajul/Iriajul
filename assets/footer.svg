<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1000"
     height="120"
     viewBox="0 0 1000 120">

<style>

.bg {
    fill:#0d1117;
}

.window {
    fill:#161b22;
    stroke:#30363d;
    stroke-width:2;
}

.prompt {
    fill:#3fb950;
    font-family:Consolas,Monaco,monospace;
    font-size:18px;
}

.text {
    fill:#c9d1d9;
    font-family:Consolas,Monaco,monospace;
    font-size:16px;
}

.key {
    fill:#3fb950;
    font-family:Consolas,Monaco,monospace;
    font-size:16px;
}

.sep {
    fill:#8b949e;
    font-family:Consolas,Monaco,monospace;
    font-size:16px;
}

.cursor {
    fill:#3fb950;
    animation:blink 1s infinite;
}

@keyframes blink {
    0%,100% { opacity:1; }
    50% { opacity:0; }
}

</style>

<rect width="1000" height="120" rx="18" class="bg"/>
<rect x="15" y="15" width="970" height="90" rx="12" class="window"/>

<text x="35" y="55" class="prompt">$ contact --info</text>

<text x="35" y="85">
  <tspan class="key">email</tspan><tspan class="text">  syedriajul9624@gmail.com</tspan><tspan class="sep">   ·   </tspan><tspan class="key">github</tspan><tspan class="text">  https://github.com/Iriajul</tspan><tspan class="sep">   ·   </tspan><tspan class="key">loc</tspan><tspan class="text">  Dhaka, Bangladesh</tspan>
</text>
<rect class="cursor" x="35" y="98" width="10" height="16"/>

</svg>
